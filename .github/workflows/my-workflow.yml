name: My first workflow
on: workflow_dispatch
jobs:
  my-first-job:
    runs-on: ubuntu-latest
    steps:
      - name: List all files
        run: ls -a
      - name: Print working directory
        run: pwd
      - name: create js file
        run: echo 'console.log("he,lo World!");' > app.js
      - name: List all files
        run: ls -a
      - name: Run Nodejs file
        run: node app.js
